# Starter pipeline for BrowserStack WDIO v9 gRPC socket repro
# Upgrades @wdio/* packages from ^7 to ^9 before install
# Rewrites specs paths in all conf files from ./ to ../
# Tracks root log/logs directories and prints all files created there

trigger:
- azure-pipelines

pool:
  vmImage: ubuntu-latest

steps:
- task: NodeTool@0
  displayName: 'Use Node.js 20.x'
  inputs:
    versionSpec: '20.x'

- script: |
    set -euxo pipefail
    git clone --depth 1 https://github.com/browserstack/webdriverio-browserstack webdriverio-browserstack
    cd webdriverio-browserstack
    node --version
    npm --version
  displayName: 'Clone BrowserStack WDIO sample repo'

- script: |
    set -euxo pipefail
    cd webdriverio-browserstack

    # Rewrite @wdio/* deps from ^7 to ^9
    node - <<'EOF'
    const fs = require('fs')
    const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
    const sections = ['dependencies', 'devDependencies', 'peerDependencies', 'optionalDependencies']
    for (const section of sections) {
      if (!pkg[section]) continue
      for (const [name, version] of Object.entries(pkg[section])) {
        if (name.startsWith('@wdio/') && typeof version === 'string' && version.startsWith('^7')) {
          pkg[section][name] = version.replace(/^\^7/, '^9')
        }
      }
    }
    fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
    EOF

    echo "Updated package.json:"
    cat package.json
  displayName: 'Upgrade @wdio/* packages to ^9'

- script: |
    set -euxo pipefail
    cd webdriverio-browserstack

    echo "Before patch:"
    find conf -type f | sort
    grep -Rni "specs: \\['\\./" conf || true

    find conf -type f \( -name "*.js" -o -name "*.cjs" -o -name "*.mjs" -o -name "*.ts" \) \
      -exec perl -0pi -e "s/specs:\\s*\\[\\s*'\\.\\//specs: ['..\\//g" {} \;

    echo "After patch:"
    grep -Rni "specs: \\['\\.\\./" conf || true
  displayName: 'Patch specs paths in all conf files'

- script: |
    set -euxo pipefail
    cd webdriverio-browserstack

    mkdir -p .ci-debug

    echo "===== BASELINE ROOT ====="
    pwd
    ls -lah

    echo "===== BASELINE conf ====="
    ls -lah conf || true

    echo "===== BASELINE tests/specs ====="
    ls -lah tests/specs || true

    {
      find . -maxdepth 1 -type f | sort
      find . -maxdepth 1 -type d | sort
      find log  -type f 2>/dev/null | sort || true
      find logs -type f 2>/dev/null | sort || true
    } > .ci-debug/before-files.txt

    echo "Recorded baseline file snapshot:"
    cat .ci-debug/before-files.txt
  displayName: 'Record baseline filesystem snapshot'

- script: |
    set -euxo pipefail
    cd webdriverio-browserstack
    npm install
  displayName: 'Install dependencies'

- script: |
    set -euxo pipefail
    cd webdriverio-browserstack
    npm run local
  displayName: 'Run BrowserStack local session'
  env:
    BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
    BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)

- script: |
    set -euxo pipefail
    cd webdriverio-browserstack

    mkdir -p .ci-debug
    rm -rf "$HOME/.browserstack" || true
    mkdir -p "$HOME/.browserstack"

    cat > .ci-debug/watch-for-socket-then-kill-cli.sh <<'EOF'
    #!/usr/bin/env bash
    set -u
    LOG_FILE="$1"

    echo "===== WATCHER START =====" >> "$LOG_FILE"
    date -Is >> "$LOG_FILE"

    BASELINE_SOCKETS="$(ls /tmp/sdk-platform-*.sock 2>/dev/null | sort || true)"
    echo "===== BASELINE SOCKETS =====" >> "$LOG_FILE"
    printf '%s\n' "$BASELINE_SOCKETS" >> "$LOG_FILE"

    for i in $(seq 1 300); do
      {
        echo "----- tick $i -----"
        date -Is
        echo "## ~/.browserstack tree"
        find "$HOME/.browserstack" -maxdepth 4 -ls 2>/dev/null || true
        echo "## matching processes"
        ps -ef | grep -E 'browserstack|sdk-platform|binary-|BrowserStackLocal' | grep -v grep || true
        echo "## tmp sockets"
        ls -l /tmp/sdk-platform-*.sock 2>/dev/null || true
      } >> "$LOG_FILE"

      CLI_BIN="$(find "$HOME/.browserstack/cli" -maxdepth 1 -type f -name 'binary-*' 2>/dev/null | head -n 1 || true)"
      CURRENT_SOCKETS="$(ls /tmp/sdk-platform-*.sock 2>/dev/null | sort || true)"
      NEW_SOCKET="$(comm -13 <(printf '%s\n' "$BASELINE_SOCKETS") <(printf '%s\n' "$CURRENT_SOCKETS") | tail -n 1 || true)"

      if [ -n "$CLI_BIN" ] && [ -n "$NEW_SOCKET" ]; then
        {
          echo "===== NEW SOCKET DETECTED ====="
          echo "CLI_BIN=$CLI_BIN"
          echo "NEW_SOCKET=$NEW_SOCKET"
          echo "Sleeping 2s before kill"
        } >> "$LOG_FILE"

        sleep 2

        CLI_PIDS="$(pgrep -f "$CLI_BIN" || true)"
        {
          echo "CLI_PIDS=$CLI_PIDS"
        } >> "$LOG_FILE"

        for pid in $CLI_PIDS; do
          kill -9 "$pid" 2>/dev/null || true
        done

        {
          echo "===== POST-KILL SNAPSHOT ====="
          ps -ef | grep -E 'browserstack|sdk-platform|binary-|BrowserStackLocal' | grep -v grep || true
          ls -l /tmp/sdk-platform-*.sock 2>/dev/null || true
        } >> "$LOG_FILE"

        exit 0
      fi

      sleep 1
    done

    echo "===== WATCHER TIMEOUT =====" >> "$LOG_FILE"
    exit 0
    EOF

    chmod +x .ci-debug/watch-for-socket-then-kill-cli.sh
    ./.ci-debug/watch-for-socket-then-kill-cli.sh .ci-debug/socket-watch.log &
    WATCHER_PID=$!

    set +e
    npm run local
    RUN_EXIT=$?
    set -e

    wait "$WATCHER_PID" || true

    echo "===== WATCHER LOG ====="
    sed -n '1,500p' .ci-debug/socket-watch.log || true

    exit $RUN_EXIT
  displayName: 'Run BrowserStack session with socket watcher'
  env:
    BROWSERSTACK_USERNAME: $(BROWSERSTACK_USERNAME)
    BROWSERSTACK_ACCESS_KEY: $(BROWSERSTACK_ACCESS_KEY)